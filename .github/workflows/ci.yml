name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            jq \
            libqt5svg5 \
            qml-module-qtquick-particles2 \
            qml-module-qtquick-window2 \
            qml-module-qtquick2 \
            qml-module-qttest \
            qtdeclarative5-dev-tools

      - name: Validate package structure
        run: |
          jq --exit-status '
            .schemaVersion == 1 and
            .id == "io.github.davidojedalopez.fear-greed" and
            .version == "1.1.0" and
            (.kinds | index("bar-widget") != null) and
            .entryPoints.barWidget == "BarWidget.qml"
          ' manifest.json >/dev/null
          test -f BarWidget.qml
          test -f Panel.qml
          test -f SentimentEffects.qml
          test -f Model.js
          test -f assets/flame.svg
          test -f assets/money.svg
          test -f README.md
          test -f LICENSE
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"

      - name: Run model tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: qmltestrunner -input tests -o -,txt
