name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq qtdeclarative5-dev-tools qml-module-qtquick2 qml-module-qttest

      - name: Validate package structure
        run: |
          jq --exit-status '
            .schemaVersion == 1 and
            .id == "io.github.davidojedalopez.fear-greed" and
            .version == "1.0.0" and
            (.kinds | index("bar-widget") != null) and
            .entryPoints.barWidget == "BarWidget.qml"
          ' manifest.json >/dev/null
          test -f BarWidget.qml
          test -f Panel.qml
          test -f Model.js
          test -f README.md
          test -f LICENSE
          test -z "$(find . -path ./.git -prune -o -type l -print -quit)"

      - name: Run model tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: qmltestrunner -input tests -o -,txt

