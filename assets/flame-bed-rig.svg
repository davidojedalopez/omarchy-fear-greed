      <stop offset="0.32" stop-color="#fde047"/>
      <stop offset="0.72" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#fef9c3"/>
      <stop offset="0.82" stop-color="#fde047"/>
      <stop offset="1" stop-color="#fb923c"/>
