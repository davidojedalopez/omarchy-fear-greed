  <title>Adjustable flame bed rig</title>
  <desc>Twelve named flame tongues with bottom pivots for staggered QML animation.</desc>

  <!--
    Runtime note: Qt SVG displays this file as a static image. For realistic
    movement, instantiate or translate the flame-* groups into QML items and
    animate each around its data-pivot with different timings.

    Suggested ranges:
      rotation: -3 to 3 degrees
      scaleY:   0.88 to 1.08
      scaleX:   0.96 to 1.04
      x offset: -2 to 2 px at a 330 px render width
      opacity:  0.82 to 1.00
  -->

  <defs>
    <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.20" stop-color="#facc15"/>
      <stop offset="0.56" stop-color="#f97316"/>
      <stop offset="0.84" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
